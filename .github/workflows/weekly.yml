name: weekly-life-weeks-update

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday, 08:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Wake up Render (free tier sleeps after inactivity)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/health" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 15
          done
          # give Render a few extra seconds to fully warm up even after /health responds
          sleep 5

      - env:
          SENDPULSE_CLIENT_ID: ${{ secrets.SENDPULSE_CLIENT_ID }}
          SENDPULSE_CLIENT_SECRET: ${{ secrets.SENDPULSE_CLIENT_SECRET }}
          SENDPULSE_BOT_ID: ${{ secrets.SENDPULSE_BOT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python weekly_job.py
